<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calculatorCSS.css" />
  </head>
  <body>
    <div class="container">
        <div class="screen">  
          <div class="time"></div> 
          <div class="location-info" id="location-info"></div>         
          <div class="calculator">
            <input type="text" name="" id="display" >
            <div class="butoane">
              <button id="sterge">C</button>
              <button id="plus">+</button>
              <button id="minus">-</button>
              <button id="multiple">*</button>
              <button id="divide">/</button>
              <button id="equal">=</button>
            </div>
          </div>
          </div> 
      <button class="green_button">📞</button>
      <button class="delete_button" id="delete-last">⌫</button>
      <button class="red_button" onclick="window.location.href='index.html'">☎️</button>
      <div class="numbers">
        <button class="one">1</button>
        <button class="two">2</button>
        <button class="three">3</button>
        <button class="four">4</button>
        <button class="five">5</button>
        <button class="six">6</button>
        <button class="seven">7</button>
        <button class="eight">8</button>
        <button class="nine">9</button>
        <button class="star">*</button>
        <button class="zero">0</button>
        <button class="hash">.</button>
      </div> <!--  end of numbers  -->
    </div> <!--  end of container  -->
    <script type="module" src="utils.js"></script>
    <script type="module" src="calculator.js"></script>
  </body>
</html>
